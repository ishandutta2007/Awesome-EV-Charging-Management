<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#051c2c" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.03); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes chargeGlow {
        0%, 100% { fill: #00f5a0; filter: drop-shadow(0 0 10px #00f5a0); }
        50% { fill: #00f2fe; filter: drop-shadow(0 0 20px #00f2fe); }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beamScan {
        0% { transform: translateX(-300px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(1300px); opacity: 0; }
      }

      .pulse-circle {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .electric-line {
        stroke-dasharray: 12, 8;
        animation: dashMove 3s linear infinite;
      }
      .charge-icon {
        animation: chargeGlow 3s ease-in-out infinite;
      }
      .floating-badge {
        animation: waveFloat 4s ease-in-out infinite;
      }
      .scanning-beam {
        animation: beamScan 5s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.3px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="url(#card-border)" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="80" r="140" fill="#00f5a0" opacity="0.12" filter="url(#glow-green)" class="pulse-circle" />
  <circle cx="150" cy="280" r="180" fill="#00f2fe" opacity="0.1" filter="url(#glow-cyan)" class="pulse-circle" />

  <!-- Grid / Circuit Background Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Electric Energy Stream Lines -->
  <path d="M 50 180 Q 300 120 600 180 T 1150 180" fill="none" stroke="url(#accent-green)" stroke-width="2.5" opacity="0.6" class="electric-line" />
  <path d="M 50 200 Q 350 260 700 200 T 1150 200" fill="none" stroke="url(#accent-cyan)" stroke-width="1.8" opacity="0.5" class="electric-line" style="animation-direction: reverse; animation-duration: 4s;" />

  <!-- Scanning Light Sweep -->
  <rect x="0" y="0" width="150" height="360" fill="url(#accent-cyan)" opacity="0.05" class="scanning-beam" />

  <!-- Header Icon & Badge -->
  <g transform="translate(80, 52)">
    <!-- Battery / Charging Plug Icon -->
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#0f2b3e" stroke="url(#accent-cyan)" stroke-width="2" />
    <!-- Lightning Bolt -->
    <path d="M 30 10 L 18 28 L 27 28 L 22 44 L 38 24 L 29 24 Z" class="charge-icon" />
    
    <!-- Status Pill -->
    <g transform="translate(70, 12)">
      <rect width="185" height="30" rx="15" fill="#0a2540" stroke="#00f5a0" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4.5" fill="#00f5a0" class="pulse-circle" />
      <text x="28" y="20" fill="#a7f3d0" class="badge-text">ECOSYSTEM DIRECTORY</text>
    </g>
  </g>

  <!-- Main Title -->
  <text x="80" y="170" fill="#ffffff" class="title-text" font-size="44">
    Awesome <tspan fill="url(#accent-green)">EV Charging</tspan> Management
  </text>

  <!-- Subtitle -->
  <text x="80" y="212" fill="#94a3b8" class="subtitle-text" font-size="18">
    Curated Hub of SaaS Platforms, Open-Source CSMS, OCPP 1.6/2.0.1, OCPI &amp; Smart Energy Solutions
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(80, 256)" class="floating-badge">
    <!-- Badge 1: CSMS & CPMS -->
    <g transform="translate(0, 0)">
      <rect width="150" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="24" fill="#38bdf8" text-anchor="middle" class="badge-text">&#9889; CSMS &amp; CPMS</text>
    </g>

    <!-- Badge 2: OCPP 1.6 / 2.0.1 -->
    <g transform="translate(165, 0)">
      <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="24" fill="#00f5a0" text-anchor="middle" class="badge-text">&#128268; OCPP 1.6J &amp; 2.0.1</text>
    </g>

    <!-- Badge 3: ISO 15118 & V2G -->
    <g transform="translate(360, 0)">
      <rect width="175" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="87" y="24" fill="#c084fc" text-anchor="middle" class="badge-text">&#128663; ISO 15118 &amp; V2G</text>
    </g>

    <!-- Badge 4: Smart Energy / OCPI -->
    <g transform="translate(550, 0)">
      <rect width="185" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="92" y="24" fill="#fbbf24" text-anchor="middle" class="badge-text">&#127760; OCPI &amp; Smart Grids</text>
    </g>

    <!-- Badge 5: Open Source -->
    <g transform="translate(750, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="82" y="24" fill="#f43f5e" text-anchor="middle" class="badge-text">&#11088; 100% Curated OSS</text>
    </g>
  </g>

  <!-- Right Decorative Geometric Graphic -->
  <g transform="translate(980, 110)">
    <polygon points="80,0 160,45 160,135 80,180 0,135 0,45" fill="none" stroke="url(#accent-cyan)" stroke-width="2" opacity="0.4" class="pulse-circle" />
    <polygon points="80,20 140,55 140,125 80,160 20,125 20,55" fill="none" stroke="url(#accent-green)" stroke-width="1.5" opacity="0.6" />
    <circle cx="80" cy="90" r="32" fill="#0c4a6e" opacity="0.5" />
    <!-- Central Flash -->
    <path d="M 86 64 L 72 88 L 82 88 L 76 112 L 94 84 L 84 84 Z" fill="#00f5a0" filter="url(#glow-green)" />
  </g>
</svg>
